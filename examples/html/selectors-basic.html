<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Members</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Club members</h1>
    <!-- An id is unique: only one element on the page can have id="president". -->
    <p id="president">Maya Lopez, president</p>
    <!-- A class can be reused on many elements. -->
    <p class="officer">Jordan Lee, vice president</p>
    <p class="officer">Priya Patel, treasurer</p>
    <!-- One element can have several classes, separated by spaces. -->
    <p class="officer new">Diego Ramirez, secretary</p>
    <p>Aisha Khan, member</p>
    <p class="new">Sam Nguyen, member</p>
  </body>
</html>
