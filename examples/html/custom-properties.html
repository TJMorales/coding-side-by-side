<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Teams</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Project teams</h1>
    <!-- All three cards use the same .team rule. The extra class only
         changes the value of one variable. -->
    <section class="teams">
      <article class="team">
        <h2>Web team</h2>
        <p>Builds the club website.</p>
      </article>
      <article class="team games">
        <h2>Games team</h2>
        <p>Makes a horror game in Unity.</p>
      </article>
      <article class="team robots">
        <h2>Robotics team</h2>
        <p>Programs the competition robot.</p>
      </article>
    </section>
  </body>
</html>
