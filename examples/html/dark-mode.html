<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tells the browser the page supports both themes, so built-in parts
         like scroll bars and form fields match. -->
    <meta name="color-scheme" content="light dark">
    <title>CS Club Meetings</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>CS Club</h1>
    <article class="card">
      <h2>Next meeting</h2>
      <p>Tuesday, 3:45 PM in Room 2115. We are building <a href="https://example.com/game">a horror game</a>.</p>
      <label for="email">Email for reminders</label>
      <input id="email" type="email" placeholder="you@example.com">
    </article>
  </body>
</html>
