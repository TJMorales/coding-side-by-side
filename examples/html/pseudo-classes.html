<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Meetings</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Meeting schedule</h1>
    <!-- No classes needed: :first-child and :nth-child pick rows by position. -->
    <ul class="schedule">
      <li>Oct 7: Intro to HTML</li>
      <li>Oct 14: CSS colors and fonts</li>
      <li>Oct 21: Flexbox layouts</li>
      <li>Oct 28: Build a club page</li>
    </ul>
    <!-- Hover, click, or Tab to these to see their states. -->
    <p>
      <a href="https://example.com/slides">Slides</a>
      <a href="https://example.com/replit">Starter code</a>
    </p>
    <label for="topic">Suggest a topic</label>
    <input id="topic" type="text" placeholder="Game design?">
    <button type="button">Send</button>
  </body>
</html>
