<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join the CS Club</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Join the CS Club</h1>
    <!-- action is where the data is sent. Each field's name becomes its key. -->
    <form action="https://example.com/signup" method="post">
      <!-- for="name" connects the label to the input with id="name". -->
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>

      <!-- type="email" brings up an email keyboard on phones and checks for an @. -->
      <label for="email">School email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">

      <label for="grade">Grade</label>
      <select id="grade" name="grade">
        <option>9</option><option>10</option><option>11</option><option>12</option>
      </select>

      <!-- Wrapping the checkbox in its label makes the words clickable too. -->
      <label class="check"><input type="checkbox" name="laptop"> I can bring a laptop</label>

      <button type="submit">Sign up</button>
    </form>
  </body>
</html>
