<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista Ridge CS Club</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Use one h1 per page for the main title. -->
    <h1>Vista Ridge CS Club</h1>
    <p>We build apps, games, and websites every Tuesday after school.</p>

    <!-- h2 starts a section. Pick the level by structure, not by size. -->
    <h2>Meetings</h2>
    <p>Room 2115, 3:45 to 5:00 PM. Bring a laptop if you have one.</p>

    <h2>Who can join</h2>
    <p>Any student. You do not need to know how to code yet.</p>
    <!-- strong marks important text. em adds stress to a word. -->
    <p><strong>New members:</strong> come to the <em>first</em> meeting of the month.</p>
  </body>
</html>
