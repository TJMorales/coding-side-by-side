<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hackathon Checklist</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Hackathon checklist</h1>
    <!-- Two boxes start checked. Click any item to check or uncheck it. -->
    <ul class="checklist">
      <li><label><input type="checkbox" checked> Join a team of three</label></li>
      <li><label><input type="checkbox" checked> Install VS Code</label></li>
      <li><label><input type="checkbox"> Charge your laptop</label></li>
      <li><label><input type="checkbox"> Read the rules</label></li>
    </ul>

    <!-- Only one of these cards contains a .badge. -->
    <div class="cards">
      <article class="card">
        <span class="badge">Full</span>
        <h2>Web track</h2>
      </article>
      <article class="card">
        <h2>Games track</h2>
      </article>
    </div>
  </body>
</html>
