<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Members</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="layout">
      <!-- The same member card markup is used in a wide column and a narrow one. -->
      <main class="slot">
        <p class="label">main: wide container</p>
        <article class="member">
          <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#1d4e89"/><text x="20" y="26" font-size="16" text-anchor="middle" fill="white">ML</text></svg>
          <div>
            <h2>Maya Lopez</h2>
            <p>President. Leads the web team and runs Tuesday meetings.</p>
          </div>
        </article>
      </main>
      <aside class="slot">
        <p class="label">aside: narrow container</p>
        <article class="member">
          <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#a33a00"/><text x="20" y="26" font-size="16" text-anchor="middle" fill="white">JL</text></svg>
          <div>
            <h2>Jordan Lee</h2>
            <p>Vice president. Leads the games team.</p>
          </div>
        </article>
      </aside>
    </div>
  </body>
</html>
