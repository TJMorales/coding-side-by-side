<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Links</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- src is the image. alt describes it for screen readers and shows if it fails to load.
         This src is a small SVG written as a data: URI, so no image file is needed. -->
    <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='80'%20height='80'%3E%3Ccircle%20cx='40'%20cy='40'%20r='38'%20fill='%231d4e89'/%3E%3Ctext%20x='40'%20y='50'%20font-size='28'%20font-family='sans-serif'%20text-anchor='middle'%20fill='white'%3ECS%3C/text%3E%3C/svg%3E"
         alt="CS Club logo: the letters CS in a blue circle" width="80" height="80">
    <h1>CS Club links</h1>

    <!-- href is where the link goes. The text between the tags is what people click. -->
    <p>Sign up on the <a href="https://example.com/cs-club">club page</a>.</p>

    <!-- target="_blank" opens the page in a new tab. Say so in the text. -->
    <p><a href="https://example.com/projects" target="_blank">Last year's projects</a> (opens in a new tab)</p>

    <!-- # plus an id jumps to that element on the same page. -->
    <p><a href="#contact">Jump to contact info</a></p>

    <h2 id="contact">Contact</h2>
    <p>Email <a href="mailto:csclub@example.com">csclub@example.com</a></p>
  </body>
</html>
