<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Colors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Club colors</h1>
    <!-- Each paragraph uses a different way to write a color. -->
    <p class="named">Named color: navy</p>
    <p class="hex">Hex: #a33a00</p>
    <p class="rgb">rgb(): rgb(46, 125, 50)</p>
    <p class="hsl">hsl(): hsl(270, 50%, 40%)</p>
    <p class="see-through">rgb() with alpha: 25% opacity</p>

    <!-- These two paragraphs show sizes in rem and %. -->
    <p class="big">This text is 1.5rem: 1.5 times the root font size.</p>
    <p class="half">This box is 50% as wide as the page body.</p>
  </body>
</html>
