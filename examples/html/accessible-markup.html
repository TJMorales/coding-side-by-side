<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hackathon Sign-up</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Hackathon sign-up</h1>
    <!-- Informative image: alt says what it shows. Decorative image: alt="" so it is skipped. -->
    <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='40'%3E%3Crect%20width='120'%20height='40'%20rx='6'%20fill='%231d4e89'/%3E%3Ctext%20x='60'%20y='26'%20font-size='16'%20font-family='sans-serif'%20text-anchor='middle'%20fill='white'%3ENov%2014%3C/text%3E%3C/svg%3E" alt="Hackathon date: November 14" width="120" height="40">
    <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='300'%20height='6'%3E%3Crect%20width='300'%20height='6'%20fill='%23a33a00'/%3E%3C/svg%3E" alt="" width="300" height="6">
    <form action="https://example.com/hackathon" method="post">
      <!-- aria-describedby links the hint, so screen readers read it with the field. -->
      <label for="team">Team name</label>
      <input id="team" name="team" required aria-describedby="team-hint">
      <p id="team-hint" class="hint">3 to 20 letters. No school names.</p>
      <!-- fieldset and legend give a group of radio buttons one shared question. -->
      <fieldset>
        <legend>Experience level</legend>
        <label><input type="radio" name="level" value="new"> New to coding</label>
        <label><input type="radio" name="level" value="some"> Some experience</label>
      </fieldset>
      <!-- The button text says what happens. "Click here" would not. -->
      <button type="submit">Register team</button>
    </form>
  </body>
</html>
