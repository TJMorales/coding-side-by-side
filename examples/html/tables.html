<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hackathon Scores</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <table>
      <!-- caption is the table's title. Screen readers announce it first. -->
      <caption>Fall hackathon scores</caption>
      <thead>
        <!-- scope="col" says this header labels the cells below it. -->
        <tr><th scope="col">Team</th><th scope="col">Code</th><th scope="col">Design</th><th scope="col">Total</th></tr>
      </thead>
      <tbody>
        <!-- scope="row" says this header labels the cells to its right. -->
        <tr><th scope="row">Byte Club</th><td>45</td><td>38</td><td>83</td></tr>
        <tr><th scope="row">Null Pointers</th><td>40</td><td>47</td><td>87</td></tr>
        <tr><th scope="row">Stack Overflowers</th><td>48</td><td>44</td><td>92</td></tr>
      </tbody>
      <tfoot>
        <tr><th scope="row">Average</th><td>44.3</td><td>43.0</td><td>87.3</td></tr>
      </tfoot>
    </table>
  </body>
</html>
