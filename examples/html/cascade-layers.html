<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Buttons</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Join a project</h1>
    <!-- Each button's text says which layer decided its color. -->
    <p>
      <button type="button" id="join-web">base layer: gray</button>
      <button type="button" class="btn">components layer: blue</button>
      <button type="button" class="btn" id="join-games">components beats the id in base: blue</button>
      <button type="button" class="btn danger">utilities layer: red</button>
      <button type="button" class="btn special">unlayered CSS: green</button>
    </p>
  </body>
</html>
