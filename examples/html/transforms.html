<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Board</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Club bulletin board</h1>
    <!-- Each note uses a different transform. Hover a note to see scale(). -->
    <section class="board">
      <article class="note rotate">
        <h2>rotate()</h2>
        <p>Hackathon Nov 14</p>
      </article>
      <article class="note move">
        <h2>translate()</h2>
        <p>New members welcome</p>
      </article>
      <article class="note grow">
        <h2>scale()</h2>
        <p>Bring a laptop</p>
      </article>
    </section>
  </body>
</html>
