<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Positioning</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- The badge is placed on the card's corner with absolute positioning. -->
    <article class="card">
      <span class="badge">New</span>
      <h2>Game jam team</h2>
      <p>Build a horror game in Unity over two weeks.</p>
    </article>

    <!-- Scroll inside this box: the heading sticks to its top. -->
    <section class="schedule">
      <h2>Fall schedule</h2>
      <p>Oct 7: Intro to HTML</p>
      <p>Oct 14: CSS colors</p>
      <p>Oct 21: Flexbox</p>
      <p>Oct 28: Positioning</p>
      <p>Nov 4: Forms</p>
      <p>Nov 14: Hackathon</p>
    </section>
  </body>
</html>
