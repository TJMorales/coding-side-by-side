<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Plans</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>CS Club plans</h1>
    <h2>This semester we will learn</h2>
    <!-- ul is an unordered list: the order does not matter. -->
    <ul>
      <li>HTML and CSS</li>
      <li>Python games</li>
      <li>Robotics
        <!-- A nested list goes inside an li, not directly inside the ul. -->
        <ul>
          <li>Sensors</li>
          <li>Motors</li>
        </ul>
      </li>
    </ul>
    <h2>How to join</h2>
    <!-- ol is an ordered list: the browser numbers the steps for you. -->
    <ol>
      <li>Fill out the sign-up form.</li>
      <li>Come to a Tuesday meeting in Room 2115.</li>
      <li>Pick a project team.</li>
    </ol>
  </body>
</html>
