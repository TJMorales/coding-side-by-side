<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS Club Project Gallery</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Project gallery</h1>
    <p>Scroll sideways. Each card snaps into place.</p>
    <!-- tabindex="0" lets keyboard users focus the strip and scroll it with arrow keys.
         The aria-label names the region for screen readers. -->
    <section class="gallery" tabindex="0" aria-label="Club projects">
      <article class="slide"><h2>Lunch menu app</h2><p>Today's menu on your phone.</p></article>
      <article class="slide"><h2>Robot scoreboard</h2><p>Live match points.</p></article>
      <article class="slide"><h2>Study timer</h2><p>25 minutes on, 5 off.</p></article>
      <article class="slide"><h2>Horror game</h2><p>Made in Unity by the games team.</p></article>
      <article class="slide"><h2>Quiz bot</h2><p>Practice AP CSA terms.</p></article>
    </section>
  </body>
</html>
